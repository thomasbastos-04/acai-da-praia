<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f6fb">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Escolha o tamanho, as frutas e os complementos do seu açaí.">
  <title>Açaí da Praia</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span>Açaí <em>da Praia</em></span>
    </div>
  </header>

  <main class="layout">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Monte seu <span>açaí.</span></h1>
      </div>
    </section>

    <section class="builder" aria-labelledby="step-title">
      <div class="step-content">
        <nav class="progress" aria-label="Etapas do pedido">
          <ol id="progress"></ol>
        </nav>
        <div class="step-meta">
          <p id="step-number"></p>
          <button class="back" id="back" type="button" hidden>Voltar</button>
        </div>
        <h2 id="step-title" tabindex="-1"></h2>
        <p class="description" id="step-description" hidden></p>
        <div id="step-body"></div>
        <div class="manual-copy" id="manual-copy" hidden>
          <label for="order-text">Toque e segure no texto para copiar.</label>
          <textarea id="order-text" readonly rows="7"></textarea>
        </div>
        <p class="copy-feedback" id="copy-feedback" role="status"></p>
      </div>

      <div class="order-bar">
        <div class="total">
          <span>Total</span>
          <output id="total" aria-live="polite" aria-atomic="true">–</output>
        </div>
        <button type="button" class="primary" id="next">Continuar</button>
      </div>
      <noscript>Ative o JavaScript no navegador para montar seu açaí.</noscript>
    </section>
  </main>
</body>
</html>
